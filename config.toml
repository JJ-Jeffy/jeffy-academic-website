baseURL = "https://jj-jeffy.github.io/jeffy-academic-website/"
languageCode = "en-us"
title = "Jeffy Jeffy"
# theme = "academic"
enableGitInfo = true
enableRobotsTXT = true

# Enable syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = true

# Pagination
[pagination]
  pagerSize = 10

[params]
  # Site author
  author = "Jeffy Jeffy"
  description = "PhD Student in Chemistry at Georgia Institute of Technology"
  
  # Contact info
  email = "jeffy@gatech.edu"  # Replace with your actual email
  location = "Atlanta, GA"
  phone = "651-424-8342"
  
  # Social media
  github = "https://github.com/YourGithubUsername"  # Replace with your actual GitHub URL
  
  # Enable animations
  enableAnimations = true
  
  # Main sections
  mainSections = ["research", "publications", "experience"]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 3
  [[menu.main]]
    name = "Publications"
    url = "/publications/"
    weight = 4
  [[menu.main]]
    name = "Experience"
    url = "/experience/"
    weight = 5
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6
  [[menu.main]]
    identifier = "gallery"
    name       = "Gallery"
    url        = "/gallery/"
    weight     = 7



[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown files

[taxonomies]
  tag = "tags"
  category = "categories"
